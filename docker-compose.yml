services:
  mariadb:
    image: ${MARIADB_DOCKER_IMAGE:-bitnamilegacy/mariadb:11.4}
    environment:
      ALLOW_EMPTY_PASSWORD: "no"
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD:-changeme}
      MARIADB_USER: ${MOODLE_DB_USER:-bn_moodle}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:-changeme}
      MARIADB_DATABASE: ${MOODLE_DB_NAME:-bitnami_moodle}
    volumes:
      - moodle_mariadb_data:/bitnami/mariadb
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 10

  moodle:
    image: ${MOODLE_DOCKER_IMAGE:-bitnamilegacy/moodle:latest}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER:-bn_moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD:-changeme}
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME:-bitnami_moodle}
      MOODLE_USERNAME: ${MOODLE_ADMIN_USERNAME:-user}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-changeme}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.test}
      MOODLE_SITE_NAME: "Moodle EdTech QA Controlled"
      ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - moodle_app_data:/bitnami/moodle
      - moodle_data:/bitnami/moodledata
      - ./scripts/moodle:/qa-seed:ro

volumes:
  moodle_mariadb_data:
  moodle_app_data:
  moodle_data:
