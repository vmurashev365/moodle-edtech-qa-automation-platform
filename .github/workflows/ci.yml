name: Phase 3 Skeleton CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate TypeScript and Cucumber skeleton
    runs-on: ubuntu-latest
    env:
      MOODLE_BASE_URL: http://localhost:8080
      MOODLE_ADMIN_USERNAME: admin
      MOODLE_ADMIN_PASSWORD: changeme
      MOODLE_TEACHER_USERNAME: teacher.qa
      MOODLE_TEACHER_PASSWORD: changeme
      MOODLE_STUDENT_USERNAME: student.qa
      MOODLE_STUDENT_PASSWORD: changeme
      MOODLE_MANAGER_USERNAME: manager.qa
      MOODLE_MANAGER_PASSWORD: changeme
      MOODLE_API_TOKEN: ""
      MOODLE_COURSE_NAME: "QA Automation Demo 101"
      MOODLE_ASSIGNMENT_NAME: "Essay: Test Automation Strategy"
      MOODLE_AUDIO_RESOURCE_NAME: "Sample Listening Task"
      MOODLE_TARGET_GRADE: "82"
      HEADLESS: "true"
      TRACE_ON_FAILURE: "true"
      VIDEO_ON_FAILURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Verify environment contract
        run: npm run verify:env

      - name: Run safe API preflight
        run: npm run test:api

      - name: Upload Cucumber and Allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-skeleton-reports
          path: |
            reports/
            screenshots/
            videos/
            traces/
          if-no-files-found: ignore
