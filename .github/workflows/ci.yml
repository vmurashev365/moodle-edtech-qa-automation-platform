name: Static Framework CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate TypeScript, Cucumber, and safe API preflight
    runs-on: ubuntu-latest
    env:
      MOODLE_BASE_URL: http://localhost:8080
      MOODLE_ADMIN_USERNAME: admin
      MOODLE_ADMIN_PASSWORD: changeme
      MOODLE_TEACHER_USERNAME: teacher.qa
      MOODLE_TEACHER_PASSWORD: changeme
      MOODLE_STUDENT_USERNAME: student.qa
      MOODLE_STUDENT_PASSWORD: changeme
      MOODLE_MANAGER_USERNAME: manager.qa
      MOODLE_MANAGER_PASSWORD: changeme
      MOODLE_API_TOKEN: ''
      MOODLE_COURSE_NAME: 'QA Automation Demo 101'
      MOODLE_ASSIGNMENT_NAME: 'Essay: Test Automation Strategy'
      MOODLE_AUDIO_RESOURCE_NAME: 'Sample Listening Task'
      MOODLE_TARGET_GRADE: '82'
      MOODLE_EXECUTION_PROFILE: fast
      MOODLE_HEADLESS: 'true'
      MOODLE_TRACE_MODE: retain-on-failure
      MOODLE_VIDEO_MODE: 'off'
      MOODLE_TERMINAL_STEPS: 'false'
      ALLURE_RUN_LABEL: static-fast-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Verify environment contract
        run: npm run verify:env

      - name: Run safe API preflight
        run: npm run test:fast:api:report

      - name: Upload Cucumber and Allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-validation-reports
          path: |
            reports/
            screenshots/
            videos/
            traces/
          if-no-files-found: ignore
